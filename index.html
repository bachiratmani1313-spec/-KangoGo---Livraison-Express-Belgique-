<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KangoGo - Livraison Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 pb-10">

    <header class="bg-yellow-400 p-6 shadow-lg rounded-b-[40px] text-center border-b-4 border-yellow-500">
        <h1 class="text-4xl font-black italic tracking-tighter text-black">KANGOGO</h1>
        <p class="text-[10px] font-bold uppercase tracking-widest text-black opacity-70">Petits sacs • Cartons • Express</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <section class="bg-white rounded-3xl shadow-xl p-6 border border-gray-100">
            <h2 class="font-black text-gray-800 uppercase text-xs mb-4 text-center">Que livrons-nous aujourd'hui ?</h2>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setType('petit', 0.8)" id="btn-petit" class="type-btn border-2 border-gray-100 rounded-2xl p-3 flex flex-col items-center transition-all">
                    <i class="fas fa-shopping-bag text-blue-500 text-xl mb-1"></i>
                    <span class="text-[10px] font-bold uppercase">Petit Sac</span>
                    <span class="text-[8px] text-gray-400">(Pralines...)</span>
                </button>
                <button onclick="setType('moyen', 1)" id="btn-moyen" class="type-btn border-2 border-yellow-400 bg-yellow-50 rounded-2xl p-3 flex flex-col items-center transition-all">
                    <i class="fas fa-box text-yellow-600 text-xl mb-1"></i>
                    <span class="text-[10px] font-bold uppercase">Carton</span>
                    <span class="text-[8px] text-gray-400">(Standard)</span>
                </button>
                <button onclick="setType('gros', 1.5)" id="btn-gros" class="type-btn border-2 border-gray-100 rounded-2xl p-3 flex flex-col items-center transition-all">
                    <i class="fas fa-truck-loading text-red-500 text-xl mb-1"></i>
                    <span class="text-[10px] font-bold uppercase">Volume</span>
                    <span class="text-[8px] text-gray-400">(Meubles...)</span>
                </button>
            </div>
        </section>

        <section class="bg-white rounded-3xl shadow-xl p-6 border border-gray-100">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1 text-center">Zone de départ/arrivée</label>
                    <select id="zone" onchange="calculer()" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl font-bold outline-none focus:border-yellow-400">
                        <option value="bruxelles">Bruxelles (19 Communes)</option>
                        <option value="belgique">Toute la Belgique</option>
                    </select>
                </div>

                <div class="relative">
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-1 text-center">Distance (KM)</label>
                    <input type="number" id="distance" value="5" oninput="calculer()" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl font-black text-xl text-center outline-none focus:border-yellow-400">
                </div>

                <div class="bg-black rounded-3xl p-6 text-center shadow-2xl">
                    <p class="text-yellow-400 text-[10px] uppercase font-black mb-1 italic">Prix de la course estimé</p>
                    <span id="resultat" class="text-5xl font-black text-white">20.00 €</span>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-3xl shadow-xl p-6 border border-gray-100">
            <div class="space-y-3">
                <input type="text" id="commune" placeholder="📍 Commune ou adresse précise" class="w-full p-4 bg-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 font-bold">
                <button onclick="envoyerWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-black py-5 rounded-2xl shadow-lg flex justify-center items-center text-lg uppercase transition-all active:scale-95">
                    <i class="fab fa-whatsapp mr-3 text-3xl"></i> Commander
                </button>
            </div>
        </section>

        <div class="grid grid-cols-2 gap-3 px-2">
            <div class="bg-blue-50 p-4 rounded-2xl text-center border border-blue-100">
                <i class="fas fa-hands-helping text-blue-500 mb-1"></i>
                <p class="text-[9px] font-black uppercase text-blue-700">Aide au chargement incluse</p>
            </div>
            <div class="bg-green-50 p-4 rounded-2xl text-center border border-green-100">
                <i class="fas fa-bolt text-green-600 mb-1"></i>
                <p class="text-[9px] font-black uppercase text-green-700">Livraison immédiate</p>
            </div>
        </div>

    </main>

    <script>
        let multiplicateurTaille = 1;
        let typeColis = "Carton Standard";

        function setType(type, mult) {
            multiplicateurTaille = mult;
            // Mise à jour visuelle des boutons
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('border-yellow-400', 'bg-yellow-50');
                btn.classList.add('border-gray-100');
            });
            document.getElementById('btn-' + type).classList.add('border-yellow-400', 'bg-yellow-50');
            
            typeColis = type === 'petit' ? "Petit Sac (Pralines/Plats)" : (type === 'moyen' ? "Carton Standard" : "Gros Volume/Meuble");
            calculer();
        }

        function calculer() {
            const dist = parseFloat(document.getElementById('distance').value) || 0;
            const zone = document.getElementById('zone').value;
            
            let base = zone === "bruxelles" ? 15 : 20; 
            let kmPrice = zone === "bruxelles" ? 1.20 : 0.95;

            let total = (base + (dist * kmPrice)) * multiplicateurTaille;
            
            // Pas de livraison en dessous de 12€ même pour un petit sac
            if (total < 12) total = 12;

            document.getElementById('resultat').innerText = total.toFixed(2) + " €";
        }

        function envoyerWhatsApp() {
            const numTel = "32XXXXXXXXX"; // À REMPLACER PAR LE NUMÉRO DE VOTRE FILS
            const lieu = document.getElementById('commune').value;
            const prix = document.getElementById('resultat').innerText;
            const dist = document.getElementById('distance').value;

            const msg = `Bonjour KangoGo !%0A%0A📦 TYPE : ${typeColis}%0A📍 LIEU : ${lieu}%0A📏 DISTANCE : ${dist} km%0A💰 PRIX ESTIMÉ : ${prix}%0A%0AEst-ce possible maintenant ?`;
            
            window.open(`https://wa.me/${numTel}?text=${msg}`, '_blank');
        }
        
        calculer();
    </script>
</body>
</html>
